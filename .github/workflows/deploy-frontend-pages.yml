name: Deploy frontend to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      # The prerender/icon tools run inside this workflow, so a change to them has
      # to redeploy — otherwise a fix lands in git and never reaches the site.
      - "tools/**"
      - ".github/workflows/deploy-frontend-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Keep CRA from promoting lint warnings to build failures.
      CI: "false"
      # Optional free relay (see worker/README.md). Empty = direct https streams only.
      # Set it as a repository *variable* named REACT_APP_PROXY_URL — no secret needed.
      REACT_APP_PROXY_URL: ${{ vars.REACT_APP_PROXY_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Resolve PUBLIC_URL for Pages
        run: |
          if [ -n "${{ vars.PAGES_BASE_PATH }}" ]; then
            echo "PUBLIC_URL=${{ vars.PAGES_BASE_PATH }}" >> "$GITHUB_ENV"
          elif [ "${{ github.repository }}" = "${{ github.repository_owner }}/${{ github.repository_owner }}.github.io" ]; then
            echo "PUBLIC_URL=" >> "$GITHUB_ENV"
          else
            echo "PUBLIC_URL=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          fi

      - name: Build frontend
        run: npm run build

      - name: Prerender station pages, sitemap and robots
        # Every popular station becomes a real HTML page with its own title, Open
        # Graph card and JSON-LD, so shared links preview properly and search
        # engines have something to index. The page is the app shell, so it still
        # boots the player. Exits 0 and skips if the public API is unreachable.
        working-directory: .
        env:
          BUILD_DIR: frontend/build
          SITE_URL: https://worldradio.io
        run: node tools/prerender.mjs

      - name: Add SPA fallback and skip Jekyll
        run: |
          cp build/index.html build/404.html
          touch build/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
