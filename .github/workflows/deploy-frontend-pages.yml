name: Deploy frontend to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      # The prerender/icon tools run inside this workflow, so a change to them has
      # to redeploy — otherwise a fix lands in git and never reaches the site.
      - "tools/**"
      - ".github/workflows/deploy-frontend-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Keep CRA from promoting lint warnings to build failures.
      CI: "false"
      # Optional free relay (see worker/README.md). Empty = direct https streams only.
      # Set it as a repository *variable* named REACT_APP_PROXY_URL — no secret needed.
      REACT_APP_PROXY_URL: ${{ vars.REACT_APP_PROXY_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Resolve PUBLIC_URL for Pages
        run: |
          if [ -n "${{ vars.PAGES_BASE_PATH }}" ]; then
            echo "PUBLIC_URL=${{ vars.PAGES_BASE_PATH }}" >> "$GITHUB_ENV"
          elif [ "${{ github.repository }}" = "${{ github.repository_owner }}/${{ github.repository_owner }}.github.io" ]; then
            echo "PUBLIC_URL=" >> "$GITHUB_ENV"
          else
            echo "PUBLIC_URL=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          fi

      - name: Build frontend
        run: npm run build

      - name: Build the station slug index
        # The catalogue walks once per deploy (about a minute) and is written as
        # small sharded JSON files, so a readable /station/<slug>/ link can be
        # resolved back to a station id without shipping a 60,000-row list to the
        # browser. Runs before the prerender: both have to agree on every slug.
        working-directory: .
        env:
          BUILD_DIR: frontend/build
        run: node tools/station-index.mjs

      - name: Prerender pages, directory pages, sitemap and robots
        # Every popular station becomes a real HTML page with its own title, Open
        # Graph card and JSON-LD; every country and genre becomes a plain static
        # directory page with real content and real links; the hubs, sitemap and
        # robots.txt come out of the same run. Station pages are the app shell, so
        # they still boot the player. Exits 0 and skips if the API is unreachable.
        working-directory: .
        env:
          BUILD_DIR: frontend/build
          SITE_URL: https://worldradio.io
          PRERENDER_LIMIT: "4000"
          OG_STATION_CARDS: "4000"
        run: node tools/prerender.mjs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --quiet --disable-pip-version-check pillow

      - name: Draw the social sharing cards
        # 1200x630 JPEGs in the site's own colours, one per shareable page — the
        # picture WhatsApp, iMessage, Slack and X show next to a link. Drawn from
        # a manifest the prerender wrote, using the Inter font committed alongside
        # the script, so both hosts produce identical cards.
        working-directory: .
        run: python tools/og-cards.py

      - name: Add SPA fallback and skip Jekyll
        run: |
          # The prerender writes a purpose-built 404.html (a 404 status with the
          # app inside it, marked noindex). Fall back to the plain shell only if
          # it did not run.
          [ -f build/404.html ] || cp build/index.html build/404.html
          touch build/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
