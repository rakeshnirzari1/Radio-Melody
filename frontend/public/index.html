<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
        <meta name="theme-color" content="#05070a" />
        <meta name="description" content="World Radio — spin the globe and listen to live radio from thousands of cities around the world." />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <link rel="icon" href="%PUBLIC_URL%/favicon.png" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="World Radio" />

        <!-- The map streams come from the relay and the catalogue from Radio-Browser:
             warm both up while the bundle is still downloading. -->
        <link rel="preconnect" href="https://radio-melody-relay.rvpnrp.workers.dev" crossorigin />
        <link rel="dns-prefetch" href="https://all.api.radio-browser.info" />
        <link rel="dns-prefetch" href="https://de1.api.radio-browser.info" />

        <!-- Boot splash. Inline, so it paints with the HTML - the 1.4 MB bundle takes
             seconds on a phone and until React mounts there was nothing on screen at
             all. Costs one compressed frame plus this CSS; removed by the script at the
             end of the body the moment the app renders. -->
        <style>
          #boot-splash {
            position: fixed;
            inset: 0;
            z-index: 90;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: radial-gradient(120% 90% at 50% 20%, #0d1a18 0%, #05070a 70%);
            transition: opacity 0.45s ease;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
          }
          #boot-splash img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.5;
          }
          #boot-splash .bs-veil {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(5, 7, 10, 0.35) 0%, rgba(5, 7, 10, 0.82) 65%, #05070a 100%);
          }
          #boot-splash .bs-copy {
            position: relative;
            padding: 0 24px;
            text-align: center;
            color: #eafff4;
          }
          #boot-splash .bs-logo {
            font-size: 13px;
            letter-spacing: 0.34em;
            text-transform: uppercase;
            color: #7bf0b8;
          }
          #boot-splash h1 {
            margin: 10px 0 18px;
            font-size: clamp(26px, 7vw, 46px);
            font-weight: 700;
            line-height: 1.12;
            letter-spacing: -0.02em;
          }
          #boot-splash .bs-spin {
            width: 34px;
            height: 34px;
            margin: 0 auto 20px;
            border: 2px solid rgba(123, 240, 184, 0.25);
            border-top-color: #7bf0b8;
            border-radius: 50%;
            animation: bs-turn 0.9s linear infinite;
          }
          @keyframes bs-turn {
            to { transform: rotate(360deg); }
          }
          #boot-splash .bs-line {
            font-size: 15px;
            color: #b9d3c8;
          }
          #boot-splash .bs-note {
            margin-top: 14px;
            font-size: 12px;
            color: #6f857b;
          }
        </style>

        <!-- Shared links: a preview card is the difference between a click and a
             scroll-past. Station pages get their own card (generated at build
             time); this is the fallback for everything else. -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="World Radio" />
        <meta property="og:title" content="World Radio — live radio from around the world" />
        <meta property="og:description" content="Spin the globe, tap a glowing dot and listen live. No account, no tracking, and your lock-screen controls keep working." />
        <meta property="og:image" content="%PUBLIC_URL%/og/home/main.jpg" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="World Radio — live radio from around the world" />
        <meta name="twitter:description" content="Spin the globe, tap a glowing dot and listen live." />
        <meta name="twitter:image" content="%PUBLIC_URL%/og/home/main.jpg" />

        <!-- iOS launch images. Without them an installed app opens on a white
             screen, which looks broken. Sizes match the media queries Apple uses. -->
        <link rel="apple-touch-startup-image" href="%PUBLIC_URL%/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
        <link rel="apple-touch-startup-image" href="%PUBLIC_URL%/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
        <link rel="apple-touch-startup-image" href="%PUBLIC_URL%/splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" />
        <link rel="apple-touch-startup-image" href="%PUBLIC_URL%/splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" />
        <link rel="apple-touch-startup-image" href="%PUBLIC_URL%/splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" />
        <link rel="apple-touch-startup-image" href="%PUBLIC_URL%/splash-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)" />
        <link rel="apple-touch-startup-image" href="%PUBLIC_URL%/splash-1536x2048.png" media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2)" />
        <link rel="apple-touch-startup-image" href="%PUBLIC_URL%/splash-1668x2388.png" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2)" />

        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "WebApplication",
                "name": "World Radio",
                "applicationCategory": "MultimediaApplication",
                "operatingSystem": "Any",
                "browserRequirements": "Requires JavaScript",
                "description": "Live radio from thousands of cities around the world on a 3D globe. Free, no account, no tracking.",
                "offers": { "@type": "Offer", "price": "0", "priceCurrency": "AUD" }
            }
        </script>
        <link rel="dns-prefetch" href="https://de1.api.radio-browser.info" />
        <link rel="dns-prefetch" href="https://de2.api.radio-browser.info" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>World Radio — Live radio from around the world</title>
        <script>
            // Browser-timing shim (previously injected by the old platform CDN bundle).
            window.addEventListener(
                "error",
                function (e) {
                    if (
                        e.error instanceof DOMException &&
                        e.error.name === "DataCloneError" &&
                        e.message &&
                        e.message.includes("PerformanceServerTiming")
                    ) {
                        e.stopImmediatePropagation();
                        e.preventDefault();
                    }
                },
                true
            );
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="boot-splash">
      <img src="%PUBLIC_URL%/splash.jpg" alt="" fetchpriority="high" width="800" height="400" />
      <div class="bs-veil"></div>
      <div class="bs-copy">
        <div class="bs-logo">World Radio</div>
        <h1>58,000 live stations,<br />all over the globe</h1>
        <div class="bs-spin"></div>
        <div class="bs-line" id="boot-splash-line">Loading the map and tuning in&hellip;</div>
        <div class="bs-note">No account, no sign-up. Sound on.</div>
      </div>
    </div>
    <div id="root"></div>
        <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, run `npm run build` or `yarn build`.
    -->
        <script>
      // Take the splash down when the app has actually rendered something, not when the
      // bundle has merely downloaded: a flash of empty map is worse than the splash.
      (function () {
        var s = document.getElementById("boot-splash");
        if (!s) return;
        var gone = false;
        var hide = function () {
          if (gone) return;
          gone = true;
          s.style.opacity = "0";
          setTimeout(function () {
            if (s.parentNode) s.parentNode.removeChild(s);
          }, 500);
        };
        var root = document.getElementById("root");
        if (root && window.MutationObserver) {
          var mo = new MutationObserver(function () {
            if (root.childElementCount) {
              mo.disconnect();
              setTimeout(hide, 800);
            }
          });
          mo.observe(root, { childList: true });
        }
        // Never a dead end: if it is genuinely slow, say so rather than spinning forever.
        setTimeout(function () {
          var l = document.getElementById("boot-splash-line");
          if (l && !gone) l.textContent = "Still going — a slow connection will do this. It will catch up.";
        }, 15000);
      })();
    </script>
</body>
</html>
